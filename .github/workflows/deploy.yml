name: Deploy Automático na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Fretflow na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e Atualizar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Verificando pasta do projeto na VPS..."
            if [ ! -d "/root/fretflow" ]; then
              echo "Primeiro deploy: Clonando repositório..."
              git clone https://github.com/${{ github.repository }}.git /root/fretflow
            fi
            cd /root/fretflow
            git clean -fd
            git fetch origin main
            git reset --hard origin/main
            echo "🐳 [CI/CD] Compilando e subindo container..."
            docker compose up -d --build
            echo "✅ [CI/CD] Fretflow atualizado com sucesso!"
